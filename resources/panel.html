<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self' {{API_BASE}} {{UI_BASE}}; img-src 'self' data:; form-action 'self' {{API_BASE}}; base-uri 'none';">
<title>{{TITLE}}</title>
<style>{{CSS}}</style>
<style id="hc-theme">{{THEME_CSS}}</style>
<script>{{HTMX}}</script>
<script>window.HC = {{CONFIG}};</script>
</head>
<body>
<div id="hc-app" class="hc-chat-app">
  <header class="hc-chat-header">
    <span class="hc-chat-brand">{{ICON}}<span class="hc-chat-title">{{TITLE}}</span></span>
    <span class="hc-chat-actions">
      <!-- The clipboard is the browser's own: no host, no engine, always there -->
      <button type="button" id="hc-copy" class="hc-chat-hbtn" hidden></button>
      <!-- Shown only when the engine can be asked for a PDF and a host can save it -->
      <button type="button" id="hc-pdf" class="hc-chat-hbtn" hidden></button>
      <button type="button" class="hc-chat-hbtn" data-action="clear" title="{{L_CLEAR}}" aria-label="{{L_CLEAR}}"
              hx-post="{{API_BASE}}/api/clear" hx-target="#hc-body" hx-swap="innerHTML">&#x21BA;</button>
      <!-- The language of the chat, as a flag: shown only when there is
           more than one to choose from, and the menu below lists them -->
      <button type="button" id="hc-lang" class="hc-chat-hbtn hc-chat-agent hc-chat-lang" hidden></button>
      <!-- The assistant in use, last on the right: its icon, name and model
           as the tooltip; with more than one configured, the button that
           opens the list below. The window of the chat has its own close
           box, so the page carries none (Escape still asks the host). -->
      <button type="button" id="hc-agent" class="hc-chat-hbtn hc-chat-agent" hidden></button>
    </span>
    <div id="hc-langs" class="hc-chat-agents hc-chat-langs" role="listbox" hidden></div>
    <div id="hc-agents" class="hc-chat-agents" role="listbox" hidden></div>
  </header>
  <main id="hc-body" class="hc-chat-body" hx-get="{{API_BASE}}/api/history" hx-trigger="load" hx-swap="innerHTML"></main>
  <section id="hc-doc" class="hc-chat-doc" hidden>
    <div class="hc-chat-doc-bar">
      <button type="button" id="hc-doc-back" class="hc-chat-hbtn" title="{{L_BACK}}" aria-label="{{L_BACK}}">&#x2190;</button>
      <span id="hc-doc-title" class="hc-chat-doc-title"></span>
      <button type="button" id="hc-doc-copy" class="hc-chat-hbtn" hidden></button>
      <button type="button" id="hc-doc-pdf" class="hc-chat-hbtn" hidden></button>
    </div>
    <div id="hc-doc-body" class="hc-chat-doc-body" tabindex="-1"></div>
  </section>
  <footer class="hc-chat-footer">
    <!-- What is attached to the next question; empty and hidden until then -->
    <div id="hc-attachments" class="hc-chat-attachments" hidden></div>
    <form id="hc-form" hx-post="{{API_BASE}}/api/send" hx-target="#hc-body" hx-swap="beforeend" autocomplete="off">
      <!-- Shown only when the engine accepts documents and the provider reads them -->
      <input type="file" id="hc-file" multiple hidden>
      <button id="hc-clip" type="button" class="hc-chat-mic" title="{{L_ATTACH}}" aria-label="{{L_ATTACH}}" hidden>
        <svg class="hc-chat-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5,6V17.5A4,4 0 0,1 12.5,21.5A4,4 0 0,1 8.5,17.5V5A2.5,2.5 0 0,1 11,2.5A2.5,2.5 0 0,1 13.5,5V15.5A1,1 0 0,1 12.5,16.5A1,1 0 0,1 11.5,15.5V6H10V15.5A2.5,2.5 0 0,0 12.5,18A2.5,2.5 0 0,0 15,15.5V5A4,4 0 0,0 11,1A4,4 0 0,0 7,5V17.5A5.5,5.5 0 0,0 12.5,23A5.5,5.5 0 0,0 18,17.5V6H16.5Z"/></svg>
      </button>
      <!-- Shown only where the host can listen: window.hcVoiceEnable(true, label) -->
      <button id="hc-mic" type="button" class="hc-chat-mic" aria-pressed="false" hidden>&#x1F3A4;</button>
      <textarea id="hc-input" class="hc-chat-input" name="message" rows="1" placeholder="{{L_PLACEHOLDER}}" aria-label="{{L_PLACEHOLDER}}"></textarea>
      <button id="hc-send" type="submit" class="hc-chat-send" title="{{L_SEND}}" aria-label="{{L_SEND}}">&#x27A4;</button>
      <button id="hc-stop" type="button" class="hc-chat-send hc-chat-stop" title="{{L_STOP}}" aria-label="{{L_STOP}}" hidden>&#x25A0;</button>
    </form>
  </footer>
</div>
<script>{{JS}}</script>
</body>
</html>
